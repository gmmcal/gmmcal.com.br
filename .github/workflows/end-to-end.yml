name: End to End Tests

on:
  - pull_request

concurrency:
  group: end-to-end-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin:
    name: Tests
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_cypress.yml@v2
    with:
      name: Admin
      application-image: "gmmcal/gmmcal:test"
      pattern: spec/end-to-end/tests/admin/**.js
      node-version: "24"
      database-name: gmmcalcombr_test

  frontend:
    name: Tests
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_cypress.yml@v2
    with:
      name: Frontend
      application-image: "gmmcal/gmmcal:test"
      pattern: spec/end-to-end/tests/frontend/**.js
      node-version: "24"
      database-name: gmmcalcombr_test
