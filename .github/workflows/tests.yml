name: Tests & Lint

on:
  - pull_request

concurrency:
  group: tests-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # LINT
  rubocop:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: Rubocop
      ruby-version: "3.4.9"
      command: bin/rubocop

  reek:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: Reek
      ruby-version: "3.4.9"
      command: bundle exec reek --config .reek.yml .

  brakeman:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: Brakeman
      ruby-version: "3.4.9"
      command: bin/brakeman

  scsslint:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: SCSSLint
      ruby-version: "3.4.9"
      command: bundle exec scss-lint --config .scss-lint.yml

  bundler-audit:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: Bundler Audit
      ruby-version: "3.4.9"
      command: bundle exec bundle-audit check --update

  eslint:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: ESLint
      node-version: "24"
      run-node: true
      command: yarn eslint

  eslint_tests:
    name: Lint
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_lint.yml@v2
    with:
      name: ESLint - Tests
      node-version: "24"
      run-node: true
      command: yarn eslint:tests

  # TESTS
  tests:
    name: Tests
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_tests.yml@v2
    with:
      ruby-version: "3.4.9"
      migration-command: bundle exec rails db:migrate:databases
      command: bundle exec rspec
      database-name: gmmcalcombr_test
