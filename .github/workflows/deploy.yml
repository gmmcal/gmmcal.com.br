name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: "Tag: Production"
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_tag.yml@v2
    concurrency:
      group: tag
      cancel-in-progress: false
    with:
      reference: ${{ github.sha }}

  release:
    name: Release
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_release.yml@v2
    needs:
      - tag
    with:
      tag: ${{needs.tag.outputs.version}}
      reference: ${{ github.sha }}

  build_test:
    name: Build
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_docker.yml@v2
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    concurrency:
      group: build-test
      cancel-in-progress: true
    with:
      name: Test
      target: test
      image: "gmmcal/gmmcal:test"
      cache_from: test-${{ github.event.repository.default_branch }}
      cache_to: test-${{ github.event.repository.default_branch }}

  build_development:
    name: Build
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_docker.yml@v2
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    concurrency:
      group: build-development
      cancel-in-progress: true
    with:
      name: Development
      target: development
      image: "gmmcal/gmmcal:development"
      cache_from: development-${{ github.event.repository.default_branch }}
      cache_to: development-${{ github.event.repository.default_branch }}

  build_production:
    name: Build
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_docker.yml@v2
    needs:
      - tag
      - release
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    concurrency:
      group: build-production
      cancel-in-progress: true
    with:
      name: Production
      target: production
      reference: ${{needs.tag.outputs.version}}
      image: "gmmcal/gmmcal:production"
      cache_from: production-${{ github.event.repository.default_branch }}
      cache_to: production-${{ github.event.repository.default_branch }}

  build_cypress:
    name: Build
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_docker.yml@v2
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    concurrency:
      group: build-cypress
      cancel-in-progress: true
    with:
      name: Cypress
      target: cypress
      image: "gmmcal/gmmcal:cypress"
      cache_from: cypress-${{ github.event.repository.default_branch }}
      cache_to: cypress-${{ github.event.repository.default_branch }}

  deploy:
    name: Deploy
    uses: gmmcal/gmmcal-reusable-workflows/.github/workflows/_deploy.yml@v2
    needs:
      - tag
      - release
    with:
      name: Production
      environment: production
      url: https://www.gustavocunha.dev
      tag: ${{ needs.tag.outputs.version }}
      ruby-version: 3.4.9
      cache_from: main
      cache_to: main
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      rails-master-key: ${{ secrets.RAILS_MASTER_KEY }}
      database-host: ${{ secrets.DATABASE_HOST }}
      postgres-user: ${{ secrets.POSTGRES_USER }}
      postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
      postgres-db: ${{ secrets.POSTGRES_DB }}
